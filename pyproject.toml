[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hksc-open-source"
version = "0.2.0"
description = "Reproducible Hong Kong equity research with explicit data provenance"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Emerson"}]
dependencies = []

[project.scripts]
hksc = "hksc.cli:main"

[tool.setuptools.packages.find]
include = ["hksc", "hksc_engine"]
